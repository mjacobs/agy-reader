edition = "2023";

package genai;

import "google/protobuf/duration.proto";

import "learning/genai/api/interactions/proto/content.proto";

message UserTimeout {
}

message ElicitationPreamble {
  repeated Content content = 1;
}

message ElicitationChoice {
  string label = 1;

  repeated Content display = 2;
}

message ConfirmationRequest {
  ElicitationChoice positive_choice = 1;

  ElicitationChoice negative_choice = 2;
}

message MultipleChoiceRequest {
  repeated ElicitationChoice choices = 1;

  bool allow_multiple_selections = 2;
}

message ConfirmationResponse {
  bool is_confirmed = 1;
}

message MultipleChoiceResponse {
  repeated string selected_choice_labels = 1;

  ContentList user_input = 2;
}

message ElicitationCallStep {
  oneof type {
    ConfirmationRequest confirmation_request = 3;

    MultipleChoiceRequest multiple_choice_request = 5;
  }

  string elicitation_id = 1;

  ElicitationPreamble preamble = 2;

  google.protobuf.Duration timeout_duration = 4;
}

message ElicitationResultStep {
  oneof type {
    ContentList user_input = 2;

    UserTimeout user_timeout = 3;

    ConfirmationResponse confirmation = 4;

    MultipleChoiceResponse multiple_choice = 5;
  }

  string elicitation_id = 1;
}
