edition = "2023";

package genai;

import "google/protobuf/duration.proto";

import "google/protobuf/struct.proto";

import "learning/genai/api/parsing/genai_json_annotations.proto";

message Content {
  oneof type {
    TextContent text = 10;

    ImageContent image = 11;

    AudioContent audio = 12;

    DocumentContent document = 13;

    VideoContent video = 14;

    ThoughtContent thought = 5;

    ToolCallContent tool_call = 24;

    ToolResultContent tool_result = 25;
  }
}

message ContentList {
  repeated Content contents = 1;
}

message WordInfo {
  string text = 1;

  google.protobuf.Duration start_offset = 2;

  google.protobuf.Duration end_offset = 3;

  string speaker = 4;
}

message SpeechAnnotation {
  string speaker = 1;

  string style = 2;
}

message TextContent {
  string text = 3;

  repeated Annotation annotations = 4;

  message Annotation {
    oneof type {
      UrlCitation url_citation = 5;

      FileCitation file_citation = 6;

      PlaceCitation place_citation = 7;

      WordInfo word_info = 8;

      SpeechAnnotation speech_metadata = 11;
    }

    int32 start_index = 1;

    int32 end_index = 2;
  }
}

message ImageContent {
  oneof data_or_uri {
    bytes data = 2;

    string uri = 6;
  }

  MimeType mime_type = 1 [json_name = "legacy_mime_type_enum"];

  string mime_type_string = 8;

  MediaResolution resolution = 5;

  enum MimeType {
    TYPE_UNSPECIFIED = 0;

    TYPE_PNG = 1;

    TYPE_JPEG = 2;

    TYPE_WEBP = 3;

    TYPE_HEIC = 4;

    TYPE_HEIF = 5;

    TYPE_GIF = 7;

    TYPE_BMP = 8;

    TYPE_TIFF = 9;

    TYPE_VIDEO_FRAME_JPEG2000 = 10;

    TYPE_VIDEO_JPEG2000 = 11;
  }
}

message AudioContent {
  oneof data_or_uri {
    bytes data = 2;

    string uri = 5;
  }

  MimeType mime_type = 1 [json_name = "legacy_mime_type_enum"];

  string mime_type_string = 11;

  int32 channels = 7;

  int32 sample_rate = 8;

  enum MimeType {
    TYPE_UNSPECIFIED = 0;

    TYPE_WAV = 1;

    TYPE_MP3 = 2;

    TYPE_AIFF = 3;

    TYPE_AAC = 4;

    TYPE_OGG = 5;

    TYPE_FLAC = 6;

    TYPE_MPEG = 7;

    TYPE_M4A = 8;

    TYPE_L16 = 9;

    TYPE_S16LE = 10;

    TYPE_OPUS = 11;

    TYPE_ALAW = 12;

    TYPE_MULAW = 13;

    TYPE_VIDEO_AUDIO_S16LE = 14;

    TYPE_WEBM = 15;
  }
}

message DocumentContent {
  oneof data_or_uri {
    bytes data = 2;

    string uri = 5;
  }

  MimeType mime_type = 1 [json_name = "legacy_mime_type_enum"];

  string mime_type_string = 6;

  enum MimeType {
    TYPE_UNSPECIFIED = 0;

    TYPE_PDF = 1;

    TYPE_CSV = 2;
  }
}

message VideoContent {
  oneof data_or_uri {
    bytes data = 2;

    string uri = 6;
  }

  oneof processing {
    Processing processing_type = 17;

    MediaProcessing processing_config = 18;
  }

  MimeType mime_type = 1 [json_name = "legacy_mime_type_enum"];

  string mime_type_string = 8;

  MediaResolution resolution = 5;

  string name = 16;

  message StaticMediaProcessing {
    google.protobuf.Duration start_offset = 1;

    google.protobuf.Duration end_offset = 2;

    double fps = 3;
  }

  message MediaProcessing {
    oneof type {
      StaticMediaProcessing static = 2;
    }
  }

  enum MimeType {
    TYPE_UNSPECIFIED = 0;

    TYPE_MP4 = 1;

    TYPE_MPEG = 2;

    TYPE_MPG = 3;

    TYPE_MOV = 4;

    TYPE_AVI = 5;

    TYPE_X_FLV = 6;

    TYPE_WEBM = 7;

    TYPE_WMV = 8;

    TYPE_3GPP = 9;

    TYPE_YT_BEYOND = 10;

    TYPE_JPEG2000 = 11;
  }

  enum Processing {
    PROCESSING_UNSPECIFIED = 0;

    STATIC = 1;

    AGENTIC = 2;
  }
}

message UrlCitation {
  string url = 1;

  string title = 2;
}

message FileCitation {
  string document_uri = 1;

  string file_name = 2;

  string source = 3;

  google.protobuf.Struct custom_metadata = 4;

  int32 page_number = 5;

  string media_id = 6;
}

message PlaceCitation {
  string place_id = 1;

  string name = 2;

  string url = 3;

  repeated ReviewSnippet review_snippets = 4;
}

message ReviewSnippet {
  string title = 1;

  string url = 2;

  string review_id = 3;
}

message Struct {
  repeated Field fields = 1;
}

message Field {
  string name = 1;

  Value value = 2;
}

message Value {
  oneof kind {
    google.protobuf.NullValue null_value = 1;

    double number_value = 2;

    string string_value = 3;

    bool bool_value = 4;

    Struct struct_value = 5;

    ListValue list_value = 6;

    Content content_value = 7;

    Function function_value = 9;
  }
}

message ListValue {
  repeated Value values = 1;
}

message GoogleSearch {
  repeated SearchType search_types = 1;

  enum SearchType {
    SEARCH_TYPE_UNSPECIFIED = 0;

    SEARCH_TYPE_WEB_SEARCH = 1;

    SEARCH_TYPE_IMAGE_SEARCH = 2;
  }
}

message ThoughtContent {
  bytes signature = 7;

  repeated ThoughtSummaryContent summary = 9;
}

message ThoughtSummaryContent {
  oneof type {
    TextContent text = 1;

    ImageContent image = 2;
  }
}

message Turn {
  oneof content {
    ContentList content_list = 3;

    string content_string = 4;
  }

  string role = 1;
}

message TurnList {
  repeated Turn turns = 1;
}

message ToolCallContent {
  oneof type {
    FunctionCallContent function_call = 2;

    CodeExecutionCallContent code_execution_call = 3;

    UrlContextCallContent url_context_call = 4;

    McpServerToolCallContent mcp_server_tool_call = 6;

    GoogleSearchCallContent google_search_call = 7;

    FileSearchCallContent file_search_call = 8;

    GoogleMapsCallContent google_maps_call = 10;
  }

  string id = 1;

  bytes signature = 9;
}

message ToolResultContent {
  oneof type {
    FunctionResultContent function_result = 2;

    CodeExecutionResultContent code_execution_result = 3;

    UrlContextResultContent url_context_result = 4;

    GoogleSearchResultContent google_search_result = 5;

    McpServerToolResultContent mcp_server_tool_result = 6;

    FileSearchResultContent file_search_result = 7;

    GoogleMapsResultContent google_maps_result = 10;
  }

  string call_id = 8;

  bytes signature = 9;
}

message FunctionCallContent {
  string name = 3;

  Struct arguments = 4;
}

message FunctionResultContent {
  oneof result {
    Struct struct_result = 3;

    FunctionResultSubcontentList content_list = 9;

    string string_result = 7;
  }

  string name = 8;

  bool is_error = 2;
}

message CodeExecutionCallContent {
  CodeExecutionCallArguments arguments = 2;

  message CodeExecutionCallArguments {
    Language language = 1;

    string code = 2;

    enum Language {
      LANGUAGE_UNSPECIFIED = 0;

      PYTHON = 1;

      BASH = 2;
    }
  }
}

message CodeExecutionResultContent {
  string result = 1;

  bool is_error = 2;
}

message UrlContextCallContent {
  UrlContextCallArguments arguments = 2;

  message UrlContextCallArguments {
    repeated string urls = 1;
  }
}

message UrlContextResultContent {
  repeated UrlContextResult result = 2;

  bool is_error = 3;

  message UrlContextResult {
    string url = 1;

    Status status = 2;

    enum Status {
      STATUS_UNSPECIFIED = 0;

      SUCCESS = 1;

      ERROR = 2;

      PAYWALL = 3;

      UNSAFE = 4;
    }
  }
}

message McpServerToolCallContent {
  string name = 1;

  string server_name = 2;

  Struct arguments = 3;
}

message McpServerToolResultContent {
  oneof result {
    Struct struct_result = 3;

    FunctionResultSubcontentList content_list = 6;

    string string_result = 4;
  }

  string name = 1;

  string server_name = 2;
}

message GoogleSearchCallContent {
  GoogleSearchCallArguments arguments = 1;

  GoogleSearch.SearchType search_type = 2;

  message GoogleSearchCallArguments {
    repeated string queries = 1;
  }
}

message GoogleSearchResultContent {
  repeated GoogleSearchResult result = 2;

  bool is_error = 3;

  message GoogleSearchResult {
    string search_suggestions = 5;
  }
}

message FileSearchCallContent {
}

message FileSearchResultContent {
  repeated FileSearchResult result = 1;

  message FileSearchResult {
  }
}

message GoogleMapsCallContent {
  GoogleMapsCallArguments arguments = 1;

  message GoogleMapsCallArguments {
    repeated string queries = 1;
  }
}

message GoogleMapsResultContent {
  repeated GoogleMapsResult result = 1;

  message GoogleMapsResult {
    repeated Places places = 1;

    string widget_context_token = 2;

    message Places {
      string place_id = 1;

      string name = 2;

      string url = 3;

      repeated ReviewSnippet review_snippets = 4;
    }
  }
}

message Function {
  string name = 1;

  string description = 2;

  Value parameters = 3;

  Value response = 5;

  bool defer_loading = 7;

  string short_description = 8;
}

message FunctionResultSubcontent {
  oneof type {
    TextContent text = 1;

    ImageContent image = 2;
  }
}

message FunctionResultSubcontentList {
  repeated FunctionResultSubcontent contents = 1;
}

enum MediaResolution {
  MEDIA_RESOLUTION_UNSPECIFIED = 0;

  LOW = 1;

  MEDIUM = 2;

  HIGH = 3;

  ULTRA_HIGH = 4;
}
