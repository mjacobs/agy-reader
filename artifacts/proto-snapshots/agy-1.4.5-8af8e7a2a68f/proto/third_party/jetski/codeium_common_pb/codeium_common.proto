  uint64 token = 2;

  double probability = 3;

  double adjusted_probability = 4;

  double logprob = 9;

  bool completion_finished = 5;

  string stop = 6;

  StopReason stop_reason = 7;

  map<uint32, AttributionStatus> attribution_statuses = 8;
}

message StreamingCompletionMap {
