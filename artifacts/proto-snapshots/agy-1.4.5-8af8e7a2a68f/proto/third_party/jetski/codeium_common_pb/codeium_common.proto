  string prompt = 2;

  string serialized_prompt = 26;

  string context_prompt = 21;

  string uid = 25;

  repeated PromptElementRange prompt_element_ranges = 8;

  repeated PromptElementKindInfo prompt_element_kind_infos = 9;

  uint64 prompt_latency_ms = 11;

  repeated PromptStageLatency prompt_stage_latencies = 12;

  uint64 num_tokenized_bytes = 20;

  string editor_language = 3;

  Language language = 4;

  string absolute_path_uri_for_telemetry = 5;

  string relative_path_for_telemetry = 6;

  string workspace_uri_for_telemetry = 13;

  string experiment_features_json = 7;

  string experiment_variant_json = 19;

  Model model = 10;

  bool has_line_suffix = 14;

  bool should_inline_fim = 15;

  Repository repository = 16;

  string model_tag = 17;

  repeated string experiment_tags = 18;

  string eval_suffix = 22;

  repeated PromptAnnotationRange prompt_annotation_ranges = 23;

  bool supports_packed_streaming_completion_maps = 24;
}

message CompletionConfiguration {
  uint64 max_tokens = 2;

  bool disable_parallel_tool_calls = 17;

  bool disable_safety_filtering = 18;

  int32 thinking_level = 19;

  uint64 num_completions = 1 [deprecated = true];

  uint64 max_newlines = 3 [deprecated = true];

  double min_log_probability = 4 [deprecated = true];

  double temperature = 5 [deprecated = true];

  double first_temperature = 6 [deprecated = true];

  uint64 top_k = 7 [deprecated = true];

  double top_p = 8 [deprecated = true];

  repeated string stop_patterns = 9 [deprecated = true];

  uint64 seed = 10 [deprecated = true];

  double fim_eot_prob_threshold = 11 [deprecated = true];

  bool use_fim_eot_threshold = 12 [deprecated = true];

  bool do_not_score_stop_tokens = 13 [deprecated = true];

  bool sqrt_len_normalized_log_prob_score = 14 [deprecated = true];

  bool last_message_is_partial = 15 [deprecated = true];

  bool return_logprob = 16 [deprecated = true];
}

message PromptElementRange {
