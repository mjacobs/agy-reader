syntax = "proto3";

package exa.codeium_common_pb;

import "google/internal/cloud/code/v1internal/credits.proto";

import "google/internal/cloud/code/v1internal/onboarding.proto";

import "google/protobuf/any.proto";

import "google/protobuf/duration.proto";

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;

option java_package = "com.exafunction.codeium";

message CompletionsRequest {
