  reserved 3;

  reserved "eval_suffix_info";

  oneof payload {
    StreamingCompletionInfo completion_info = 1;

    StreamingCompletionMap completion_map = 2;

    PackedStreamingCompletionMaps packed_completion_maps = 4;
