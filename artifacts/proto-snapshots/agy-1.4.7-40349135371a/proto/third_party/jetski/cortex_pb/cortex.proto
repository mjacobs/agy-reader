syntax = "proto3";

package exa.cortex_pb;

import "google/internal/cloud/code/v1internal/credits.proto";

import "google/protobuf/any.proto";

import "google/protobuf/duration.proto";

import "google/protobuf/empty.proto";

import "google/protobuf/struct.proto";

import "google/protobuf/timestamp.proto";

import "third_party/jetski/browser_pb/browser.proto";

import "third_party/jetski/hooks_pb/hooks.proto";

import "third_party/jetski/chat_client_server_pb/chat_client_server.proto";

import "third_party/jetski/chat_pb/chat.proto";

import "third_party/jetski/codeium_common_pb/codeium_common.proto";

import "third_party/jetski/context_module_pb/context_module.proto";

import "third_party/jetski/diff_action_pb/diff_action.proto";

import "third_party/jetski/opensearch_clients_pb/opensearch_clients.proto";

import "learning/genai/api/interactions/proto/steps.proto";

option java_multiple_files = true;

option java_package = "com.exafunction.codeium.cortex";

message WorkflowSpec {
  reserved 5;

  string path = 1;

  string name = 2;

  string description = 3;

  string content = 4;

  bool is_builtin = 6;

  CortexMemoryScope scope = 7;

  string base_dir = 8;

  bool disable_model_invocation = 9;

  string plugin_name = 10;

  bool disable_slash_command = 11;

  string discovered_in = 12;

  DiscoveryCategory discovery_category = 13;

  string icon = 14;

  string logo = 15;

  MarketplaceInstall installed_from = 16;

  string display_name = 17;

  exa.codeium_common_pb.PluginRef plugin = 18;

  string depot_path = 19;
}

message FlowSpec {
  string path = 1;

  string name = 2;

  string description = 3;

  string script_path = 4;

  string plugin_name = 5;

  string args_schema = 6;

  bool is_library = 7;

  bool is_builtin = 8;

  DiscoveryCategory discovery_category = 9;
}

message MarketplaceInstall {
  string marketplace = 1;

  string id = 2;

  string version = 3;
}

message CortexPlanSummaryComponent {
  oneof component {
    string text = 1;

    exa.codeium_common_pb.ContextScopeItem citation = 2;
  }
}

message CodingStepState {
  string plan_id = 1;

  string goal = 2;

  repeated ActionState action_states = 3;

  repeated CortexStepOutline outlines = 7;

  repeated CortexPlanSummaryComponent summary_components = 8;

  string post_summary_text = 9;

  bool plan_fully_generated = 4;

  bool plan_finished = 5;

  PlanDebugInfo debug_info = 6;

  bool plan_summary_confirmed = 10;

  bool plan_summary_fully_generated = 11;

  repeated exa.context_module_pb.CciWithSubrangeWithRetrievalMetadata cci_list = 12;
}

message CortexPlanState {
  repeated CortexStepState steps = 1;

  repeated CortexStepOutline outlines = 2;

  uint32 current_step_index = 3;

  PlanDebugInfo debug_info = 4;
}

message CortexStepOutline {
  uint32 step_number = 1;

  string action_name = 2;

  string json_args = 3;

  repeated uint32 parent_step_numbers = 4;
}

message CortexStepState {
  oneof step {
    CodingStepState coding = 1;
  }
}

message CortexResearchState {
  uint32 total_retrieved_count = 1;

  repeated exa.codeium_common_pb.CciWithSubrange top_retrieved_items = 2;

  ResearchDebugInfo debug_info = 3;

  repeated exa.codeium_common_pb.CciWithSubrange full_cci_list = 4;
}

message ResearchDebugInfo {
  string query = 1;

  repeated string files_scanned = 2;
}

message CortexWorkflowState {
  CortexRequestSource request_source = 6;

  string goal = 1;

  PlanInput plan_input = 2;

  CortexResearchState research_state = 3;

  CortexPlanState plan_state = 4;

  string error = 5;
}

message CortexRunState {
  CortexWorkflowState workflow_state = 1;

  exa.codeium_common_pb.GraphExecutionState execution_state = 2;

  bool done = 3;
}

message PlanInput {
  string goal = 1;

  repeated string next_steps = 5;

  repeated string target_directories = 2;

  repeated string target_files = 3;

  repeated exa.codeium_common_pb.ContextScopeItem scope_items = 4;
}

message ActionSpec {
  oneof spec {
    ActionSpecCommand command = 1;

    ActionSpecCreateFile create_file = 2;

    ActionSpecDeleteFile delete_file = 4;

    ActionSpecSed sed = 5;
  }

  repeated uint32 parent_step_indices = 3;
}

message ActionSpecCreateFile {
  string instruction = 1;

  exa.codeium_common_pb.PathScopeItem path = 2;

  repeated exa.codeium_common_pb.CodeContextItem reference_ccis = 3;

  bool overwrite = 4;

  bool append = 5;
}

message ActionSpecDeleteFile {
  exa.codeium_common_pb.PathScopeItem path = 1;
}

message ActionSpecSed {
  repeated string expressions = 1;

  exa.codeium_common_pb.PathScopeItem path = 3;

  map<string, string> file_content = 2;
}

message LineRangeTarget {
  string absolute_uri = 1;

  uint32 start_line = 2;

  uint32 end_line = 3;
}

message CommandContentTarget {
  string content = 1;

  string absolute_uri = 2;
}

message ReplacementChunk {
  string target_content = 1;

  string replacement_content = 2;

  bool allow_multiple = 3;

  bool target_has_carriage_return = 4;

  repeated string context_lines = 5;

  int32 start_line = 6;

  int32 end_line = 7;

  AcknowledgementType acknowledgement_type = 11;

  int32 index = 12;
}

message ActionSpecCommand {
  string instruction = 1;

  repeated ReplacementChunk replacement_chunks = 9;

  bool is_edit = 2;

  bool use_fast_apply = 8;

  oneof target {
    exa.codeium_common_pb.CodeContextItem code_context = 3;

    exa.codeium_common_pb.PathScopeItem file = 4;

    exa.codeium_common_pb.CciWithSubrange cci_with_subrange = 6;

    LineRangeTarget line_range = 7;

    CommandContentTarget content_target = 10;
  }

  repeated exa.codeium_common_pb.CodeContextItem reference_ccis = 5;

  string classification = 11;

  InteractiveCascadeEditImportance importance = 12;
}

message ActionState {
  string step_id = 5;

  ActionStatus status = 1;

  ActionSpec spec = 2;

  ActionResult result = 3;

  string error = 4;

  uint32 step_version = 6;

  uint32 plan_version = 7;
}

message ActionResult {
  oneof result {
    ActionResultEdit edit = 1;
  }

  bool apply_existing_result = 2;
}

message ActionDebugInfo {
  repeated DebugInfoEntry entries = 1;

  message DebugInfoEntry {
    string key = 1;

    string value = 2;
  }
}

message ActionResultEdit {
  reserved 13;

  reserved "replacement_chunk_errors";

  string absolute_path_migrate_me_to_uri = 1 [deprecated = true];

  exa.diff_action_pb.DiffBlock diff = 2;

  string context_prefix = 3 [deprecated = true];

  string context_suffix = 4 [deprecated = true];

  ActionDebugInfo debug_info = 5;

  string prompt_id = 12;

  string completion_id = 6;

  string file_content_hash = 7;

  string absolute_uri = 8;

  repeated exa.codeium_common_pb.CodeContextItem result_ccis = 9;

  string original_content = 10 [deprecated = true];

  bool create_file = 11;
}

message RetrievalStatus {
  uint32 total_retrieved_count = 1;

  repeated exa.codeium_common_pb.CciWithSubrange top_retrieved_items = 2;
}

message PlanState {
  PlanStatus status = 4;

  string plan_id = 1;

  PlanInput plan_input = 2;

  repeated ActionState actions = 3;

  RetrievalStatus retrieval_status = 6;

  string error = 5;

  PlanDebugInfo debug_info = 7;
}

message PlanDebugInfo {
  string raw_response = 1;

  uint32 plan_tokens = 2;

  float plan_cost = 3;

  string system_prompt = 4;

  repeated exa.chat_pb.ChatMessagePrompt message_prompts = 5;
}

message CortexPlanConfig {
  exa.codeium_common_pb.ChatNodeConfig model_config = 1;

  uint32 max_nominal_continuations = 2;

  uint32 max_error_continuations = 3;
}

message CortexConfig {
  bool record_telemetry = 11;

  bool add_distill_node = 6;

  exa.codeium_common_pb.ChatNodeConfig distill_config = 10;

  exa.codeium_common_pb.MQueryConfig m_query_config = 8;

  string m_query_model_name = 12;

  bool use_macro_planner = 1;

  CortexPlanConfig macro_plan_config = 4;

  PlanConfig plan_config = 9;

  CortexPlanConfig code_plan_config = 5;

  bool auto_prepare_apply = 2;

  uint32 num_prepare_retries = 3;
}

message PlanConfig {
  reserved 6;

  reserved "no_augment_command";

  string plan_model_name = 1;

  uint32 max_tokens_per_plan = 2;

  float max_token_fraction = 3;

  float chat_temperature = 4;

  uint64 chat_completion_max_tokens = 5;

  bool augment_command = 9;

  exa.codeium_common_pb.ExperimentConfig experiment_config = 7;

  exa.codeium_common_pb.MQueryConfig m_query_config = 8;
}

message CortexPlanSummary {
  string cortex_id = 1;

  PlanInput plan_input = 2;

  google.protobuf.Timestamp created_at = 3;

  bool done = 4;
}

message WorkspaceInitializationData {
  WorkspaceType workspace_type = 1;

  oneof data {
    WorkspaceInitializationDataGit git = 2;

    WorkspaceInitializationDataPiper piper = 3;

    WorkspaceInitializationDataGitOnBorg git_on_borg = 4;
  }
}

message WorkspaceInitializationDataGit {
  CortexWorkspaceMetadata metadata = 1;

  string merge_base_commit_hash = 2;

  optional string merge_base_head_patch_string = 3;

  optional string head_working_patch_string = 4;

  exa.codeium_common_pb.WorkspaceStats workspace_stats = 5;

  bool repo_is_public = 6;
}

message WorkspaceInitializationDataPiper {
  string workspace_folder_absolute_uri = 1;

  int64 base_cl = 2 [deprecated = true];

  oneof base_state {
    int64 base_changelist = 5;

    int64 citc_snapshot_id = 4;
  }

  repeated FileDiff file_diffs = 3;
}

message WorkspaceInitializationDataGitOnBorg {
  string superproject_commit_hash = 1;

  string repo_name = 2;

  string branch_name = 3;

  string workspace_folder_absolute_uri = 6;
}

message FileDiff {
  string depot_path = 1;

  oneof file_op {
    FileDiffAdd add = 2;

    FileDiffRemove remove = 3;

    FileDiffModify modify = 4;
  }
}

message FileDiffAdd {
  string content = 1;
}

message FileDiffRemove {
}

message FileDiffModify {
  string diff = 1;
}

message StateInitializationData {
  google.protobuf.Timestamp timestamp = 1;

  string state_id = 2;

  repeated WorkspaceInitializationData workspaces = 3;

  AritfactInitializationData artifacts = 4;
}

message AritfactInitializationData {
  string artifact_dir_uri = 1;

  string artifact_base_dir_uri = 2;

  map<string, bytes> compressed_artifact_files = 3;
}

message CortexWorkspaceMetadata {
  string workspace_folder_absolute_uri = 1;

  string git_root_absolute_uri = 2;

  exa.codeium_common_pb.Repository repository = 3;

  string branch_name = 4;
}

message AgentScriptCommandSpec {
  string command = 1;

  repeated string args = 2;

  CustomizationPath work_dir = 3;
}

message AgentScriptPythonSpec {
  string main_py_path_uri = 1;

  string requirements_txt_path_uri = 2;

  string relative_path_to_main_py = 3;

  string relative_path_to_requirements_txt = 4;
}

message AgentScriptConfigPath {
  oneof config_path {
    string config_path_uri = 1;

    string relative_path_to_config = 2;
  }
}

message AgentCustomization {
  string path = 1;

  AgentScriptItem agent = 2;

  bool is_global = 3;

  bool is_builtin = 4;
}

message PluginCustomization {
  string path = 1;

  PluginItem plugin = 2;

  bool is_global = 3;
}

message PluginThemeSeeds {
  string background = 1;

  string foreground = 2;

  string primary = 3;

  string primary_foreground = 4;
}

message PluginThemeItem {
  string id = 1;

  string label = 2;

  string mode = 3;

  PluginThemeSeeds seeds = 4;

  map<string, string> syntax = 5;
}

message PluginItem {
  string name = 1;

  string description = 2;

  bool disabled = 3;

  string logo = 4;

  string version = 5;

  repeated string suggested_prompts = 6;

  string display_name = 7;

  repeated string skills = 8;
}

message AgentScriptItem {
  string name = 1;

  string description = 8;

  bool disabled = 9;

  bool hidden = 10;

  optional bool subagent = 12;

  optional bool main_agent = 13;

  oneof source {
    AgentScriptCommandSpec command_spec = 3;

    AgentScriptPythonSpec python_spec = 4;

    AgentScriptConfigPath config_path = 6;

    CustomAgentSpec config = 7;

    CascadeConfig cascade_config = 11 [deprecated = true];
  }

  bool disable_model_selection = 14;

  ModelTier model_tier = 15;

  string input_placeholder = 16;

  string plugin_name = 17;
}

message ExecutableScriptSpec {
  oneof spec {
    AgentScriptCommandSpec command_spec = 1;

    AgentScriptPythonSpec python_spec = 2;
  }
}

message ToolSourceMetadata {
  string conversation_id = 1;

  int32 step_index = 2;

  exa.codeium_common_pb.ChatToolCall tool_call = 3;
}

message SidecarUserConfig {
  optional bool enabled = 1;

  oneof project_scope {
    string project_id = 2;

    bool all_projects = 3 [deprecated = true];
  }

  map<string, string> argument_values = 4;

  int32 schema_version = 6;

  SidecarAgentPermissions resolved_permissions = 5;
}

message SidecarArgumentDefinition {
  string key = 1;

  string description = 2;

  oneof type {
    StringArgument string_arg = 3;

    WorkspaceArgument workspace_arg = 4;
  }

  message StringArgument {
    string default_value = 1;

    string placeholder = 2;
  }

  message WorkspaceArgument {
  }
}

message SidecarAgentPermissions {
  repeated string workspace_uris = 1;

  repeated string access_grants = 2;

  bool allows_user_interactions = 3;
}

message SidecarConfig {
  oneof mode {
    string command = 1;

    string builtin = 9;
  }

  string restart_policy = 2;

  repeated string args = 3;

  string description = 5;

  bool has_web_ui = 6;

  map<string, string> env = 7;

  string display_name = 8;

  bool disabled = 4 [deprecated = true];

  SidecarUIConfig ui_config = 10;

  SidecarAgentPermissions agent_permissions = 11;

  repeated SidecarArgumentDefinition arguments = 12;
}

message SidecarUIView {
  string url = 1 [deprecated = true];

  SidecarUIEntrypoint entrypoint = 2;

  string path = 3;

  string title = 4;

  repeated string file_extensions = 5;
}

message SidecarUIConfig {
  string display_name = 1;

  repeated SidecarUIView views = 2;
}

message SidecarStatusInfo {
  string sidecar_id = 1;

  SidecarConfig config = 2;

  SidecarStatus status = 3;

  string last_error = 4;

  int64 start_time_ms = 5;

  int32 web_port = 6;

  SidecarUIConfig ui_config = 7 [deprecated = true];

  string base_url = 8;

  SidecarUserConfig user_config = 9;

  SidecarErrorSource error_source = 10;

  bool is_bundled = 11;

  string plugin_path = 12;
}

message SidecarCommandSource {
  string sidecar_id = 1;

  SidecarConfig config = 2;
}

message SourceMetadata {
  oneof payload {
    ToolSourceMetadata tool = 1;

    SidecarCommandSource sidecar = 2;
  }

  bool hide_from_conversation_list = 3;
}

message SendMessageEvent {
  string recipient_id = 1;

  string content = 2;
}

message NewConversationEvent {
  string prompt = 1;

  string conversation_id = 2;
}

message ConversationMetadataEvent {
  CortexTrajectoryMetadata metadata = 1;
}

message SidecarEventPayload {
  oneof event {
    SendMessageEvent send_message = 1;

    NewConversationEvent new_conversation = 2;

    ConversationMetadataEvent conversation_metadata = 3;
  }
}

message SidecarEvent {
  int64 timestamp_ms = 1;

  int64 command_invocation_timestamp_ms = 2;

  string error = 3;

  SidecarEventPayload payload = 4;
}

message CortexTrajectoryMetadata {
  reserved 13, 14;

  repeated CortexWorkspaceMetadata workspaces = 1 [deprecated = true];

  google.protobuf.Timestamp created_at = 2;

  string initialization_state_id = 3;

  string parent_conversation_id = 5;

  string root_conversation_id = 6;

  repeated string workspace_uris = 7;

  SubagentSpec subagent_spec = 8;

  CustomAgentSpec static_config = 10;

  ExecutableScriptSpec executable_spec = 11;

  SourceMetadata source_metadata = 12;

  repeated int32 mendel_experiment_ids = 15;

  AgentScriptItem agent_script = 4;

  bool is_battle_mode_fork = 16;

  string project_id = 18;

  string environment_id = 19;

  int32 nesting_depth = 17;

  repeated string tags = 20;

  repeated StringReplacement replacements = 21;

  BattleModeMetadata battle_mode_metadata = 22;

  exa.codeium_common_pb.RemoteControlDetails remote_control_details = 23;
}

message StringReplacement {
  string original = 1;

  string replacement = 2;
}

message BattleModeMetadata {
  repeated string cloned_workspace_uris = 1;

  string parent_conversation_id = 2;

  exa.codeium_common_pb.ModelInfo model_info_override = 3;
}

message CloneStrategy {
