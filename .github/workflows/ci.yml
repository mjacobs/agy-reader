name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (Go and Python helpers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            scripts/proto-printer/go.sum

      - name: Check formatting (gofmt)
        run: |
          # The same files `make fmt` rewrites; CI reports instead of rewriting.
          unformatted=$(gofmt -l $(find . -maxdepth 1 -name '*.go') $(find internal cmd -name '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files (run make fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Go tests (race detector)
        run: go test -race -count=1 ./...

      - name: Vet and build the proto printer
        working-directory: scripts/proto-printer
        run: |
          go vet ./...
          go build -o /dev/null .

      - name: Python helper tests (system python3, standard library only)
        # Equivalent to `make maintenance-test`, verbose so each skip is listed.
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Python helper tests (with protobuf and grpcio-tools)
        # Versions documented in skills/agy-proto-snapshot/SKILL.md. Without them the
        # descriptor and snapshot tests skip themselves, so this run covers them.
        run: |
          python3 -m venv "$RUNNER_TEMP/proto-venv"
          "$RUNNER_TEMP/proto-venv/bin/pip" install --disable-pip-version-check \
            protobuf==7.36.2 grpcio-tools==1.84.0
          "$RUNNER_TEMP/proto-venv/bin/python" -B -m unittest discover -s scripts -p 'test_*.py' -v

  macos:
    # The reader and the argv token mode of agy-pair.py run on macOS. The no-flag and
    # shim modes need Linux /proc, and their tests skip themselves here.
    name: macOS (Go and Python helpers)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Go tests
        # The race detector run is on Linux; plain tests keep the macOS job short.
        run: go test -count=1 ./...

      - name: Python helper tests (system python3, standard library only)
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py' -v

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned to the release the current code was checked against.
          version: v2.5.0

  # TEMPORARY: repeats the tmux exit status tests to show the fix holds on
  # GitHub's runners. Removed before merging.
  tmux-stress:
    name: tmux exit status stress (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: tmux build
        run: |
          tmux -V
          dpkg -l tmux libutempter0 | tail -2
          ldd "$(command -v tmux)" | grep -E 'utempter|systemd' || true

      - name: New race test against the previous helper (failures expected)
        run: |
          old="$RUNNER_TEMP/old"
          mkdir -p "$old"
          cp scripts/test_agy_pair.py "$old/"
          git show c77e50e:scripts/agy-pair.py > "$old/agy-pair.py"
          lost=0
          for i in $(seq 1 20); do
            python3 -B -m unittest discover -s "$old" -p test_agy_pair.py \
              -k test_status_reports_an_exit_tmux_has_not_recorded > "$old/out" 2>&1 || lost=$((lost+1))
          done
          grep -m1 "status unknown" "$old/out" || true
          echo "previous helper: $lost of 20 runs failed"

      - name: Both tmux exit status tests, 50 rounds, with the fix
        run: |
          failed=0
          for i in $(seq 1 50); do
            if ! python3 -B -m unittest discover -s scripts -p test_agy_pair.py \
                -k test_detached_failure_remains_inspectable \
                -k test_status_reports_an_exit_tmux_has_not_recorded > out 2>&1; then
              failed=$((failed+1)); cat out
            fi
          done
          grep -E "^Ran" out
          echo "with the fix: $failed of 50 rounds failed"
          test "$failed" -eq 0
